<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="100%" height="100%" fill="#f7f5f2"/><text x="64" y="78" font-family="Arial, sans-serif" font-size="20" fill="#9c4b2e">FROM RECORDS TO THE RIGHT FILE</text><text x="64" y="150" font-family="Georgia, serif" font-size="46" fill="#1a1a1a">Do the grouping once. Load what’s needed.</text><rect x="64" y="210" width="420" height="222" rx="24" fill="#fffdfa" stroke="#ddd5cd"/><text x="89" y="260" font-family="Georgia, serif" font-size="30" fill="#1a1a1a">CDN variant records</text><text x="89" y="323" font-family="Arial, sans-serif" font-size="24" fill="#655e58">One row per variant</text><text x="89" y="362" font-family="Arial, sans-serif" font-size="24" fill="#655e58">Grouped at build time</text><path d="M488 320h16m-6-6 6 6-6 6" fill="none" stroke="#9c4b2e" stroke-width="2"/><rect x="510" y="210" width="420" height="222" rx="24" fill="#fffdfa" stroke="#ddd5cd"/><text x="535" y="260" font-family="Georgia, serif" font-size="30" fill="#1a1a1a">Category indexes</text><text x="535" y="323" font-family="Arial, sans-serif" font-size="24" fill="#655e58">System icons · Emoji</text><text x="535" y="362" font-family="Arial, sans-serif" font-size="24" fill="#655e58">Illustrations</text><path d="M934 320h16m-6-6 6 6-6 6" fill="none" stroke="#9c4b2e" stroke-width="2"/><rect x="956" y="210" width="420" height="222" rx="24" fill="#fffdfa" stroke="#ddd5cd"/><text x="981" y="260" font-family="Georgia, serif" font-size="30" fill="#1a1a1a">Browse on demand</text><text x="981" y="323" font-family="Arial, sans-serif" font-size="24" fill="#655e58">Cached category index</text><text x="981" y="362" font-family="Arial, sans-serif" font-size="24" fill="#655e58">Visible rows + buffer</text><text x="64" y="506" font-family="Arial, sans-serif" font-size="19" fill="#9c4b2e">AFTER SELECTING AN ASSET</text><rect x="64" y="548" width="420" height="222" rx="24" fill="#eef0e9" stroke="#ddd5cd"/><text x="89" y="600" font-family="Georgia, serif" font-size="30" fill="#1a1a1a">Asset-specific controls</text><text x="89" y="660" font-family="Arial, sans-serif" font-size="24" fill="#655e58">Choose available variants</text><text x="89" y="699" font-family="Arial, sans-serif" font-size="24" fill="#655e58">Size, style, tone, or theme</text><path d="M488 655h16m-6-6 6 6-6 6" fill="none" stroke="#9c4b2e" stroke-width="2"/><rect x="510" y="548" width="420" height="222" rx="24" fill="#eef0e9" stroke="#ddd5cd"/><text x="535" y="600" font-family="Georgia, serif" font-size="30" fill="#1a1a1a">One active variant</text><text x="535" y="660" font-family="Arial, sans-serif" font-size="24" fill="#655e58">Preview and carousel</text><text x="535" y="699" font-family="Arial, sans-serif" font-size="24" fill="#655e58">stay synchronized</text><path d="M934 655h16m-6-6 6 6-6 6" fill="none" stroke="#9c4b2e" stroke-width="2"/><rect x="956" y="548" width="420" height="222" rx="24" fill="#eef0e9" stroke="#ddd5cd"/><text x="981" y="600" font-family="Georgia, serif" font-size="30" fill="#1a1a1a">Use the selected file</text><text x="981" y="660" font-family="Arial, sans-serif" font-size="24" fill="#655e58">Copy its CDN URL</text><text x="981" y="699" font-family="Arial, sans-serif" font-size="24" fill="#655e58">or download it</text><text x="64" y="843" font-family="Arial, sans-serif" font-size="22" fill="#655e58">Implementation diagram drawn from the supplied final diff</text></svg>