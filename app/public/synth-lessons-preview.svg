<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A filter envelope moves the cutoff over time</title>
  <desc id="desc">A filter cutoff knob on the left, connected to an attack, decay, sustain, and release curve on the right.</desc>
  <rect width="1200" height="900" fill="#d7d7d3"/>
  <rect x="38" y="38" width="1124" height="824" rx="26" fill="#e7e7e3" stroke="#aaa9a3" stroke-width="2"/>
  <text x="86" y="105" fill="#666660" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">A SYNTH LESSON, IN ONE PICTURE</text>
  <text x="86" y="164" fill="#171717" font-family="Arial, sans-serif" font-size="42" font-weight="700">The cutoff knob, in motion.</text>
  <text x="86" y="211" fill="#555550" font-family="Arial, sans-serif" font-size="21">An envelope turns the filter for you as each note plays.</text>
  <rect x="86" y="260" width="1028" height="520" rx="20" fill="#181919"/>
  <text x="125" y="310" fill="#aaa" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">ONE CONTROL · TWO WAYS TO MOVE IT</text>
  <path d="M600 350V724" stroke="#454646" stroke-width="2" stroke-dasharray="6 10"/>
  <text x="328" y="382" fill="#e9eadf" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">TURN THE CUTOFF</text>
  <text x="842" y="382" fill="#e9eadf" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">LET THE ENVELOPE MOVE IT</text>
  <circle cx="328" cy="535" r="104" fill="#242626" stroke="#555" stroke-width="3"/>
  <path d="M271 592A80 80 0 1 1 385 592" fill="none" stroke="#555" stroke-width="9" stroke-linecap="round"/>
  <path d="M271 592A80 80 0 0 1 296 472" fill="none" stroke="#ff5a20" stroke-width="9" stroke-linecap="round"/>
  <path d="M328 535L291 477" stroke="#f0d642" stroke-width="8" stroke-linecap="round"/>
  <path d="M271 592L260 588 271 542 294 485 302 489 281 546Z" fill="#ff5a20"/>
  <path d="M328 535 287 470 303 463 342 528Z" fill="#f0d642"/>
  <circle cx="328" cy="535" r="11" fill="#f0d642"/>
  <text x="328" y="681" fill="#bbb" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Move it now.</text>
  <text x="328" y="710" fill="#888" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">The sound changes with your hand.</text>
  <g stroke="#343636" stroke-width="2"><path d="M680 465H1068M680 550H1068M680 635H1068"/></g>
  <path d="M680 638 C724 638 748 445 799 445 C844 445 845 550 900 550 C945 550 950 570 985 570 C1021 570 1035 640 1068 640 L1068 675 L680 675Z" fill="#ff5a20" opacity=".13"/>
  <path d="M680 638 C724 638 748 445 799 445" fill="none" stroke="#78baff" stroke-width="6" stroke-linecap="round"/>
  <path d="M799 445 C844 445 845 550 900 550" fill="none" stroke="#ffc56d" stroke-width="6"/>
  <path d="M900 550 C945 550 950 570 985 570" fill="none" stroke="#83cf93" stroke-width="6"/>
  <path d="M985 570 C1021 570 1035 640 1068 640" fill="none" stroke="#c7a0ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M680 638 687 638 802 447 796 444Z" fill="#78baff"/>
  <path d="M797 442 803 447 904 548 898 553Z" fill="#ffc56d"/>
  <path d="M898 547 901 553 987 567 985 574Z" fill="#83cf93"/>
  <path d="M982 568 988 570 1071 638 1065 643Z" fill="#c7a0ff"/>
  <g fill="#aaa" font-family="Arial, sans-serif" font-size="14"><text x="740" y="700" text-anchor="middle">ATTACK</text><text x="846" y="700" text-anchor="middle">DECAY</text><text x="946" y="700" text-anchor="middle">SUSTAIN</text><text x="1030" y="700" text-anchor="middle">RELEASE</text><text x="680" y="735">NOTE PRESSED</text><text x="1068" y="735" text-anchor="end">NOTE RELEASED</text></g>
  <text x="600" y="821" fill="#555550" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Same cutoff control. Attack, decay, sustain, and release shape the movement.</text>
</svg>
