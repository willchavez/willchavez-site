<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="A selected project by Will Chavez.">
  <title>Project — Will Chavez</title>
  <style>
    @font-face{font-family:'Source Serif 4';src:url('fonts/source-serif-4-latin.woff2') format('woff2');font-weight:200 900;font-display:swap}
    *{box-sizing:border-box;margin:0;padding:0}
    :root{color-scheme:light dark;--paper:#f7f5f2;--ink:#1a1a1a;--muted:#756f69;--rust:#9c4b2e;--line:#ddd5cd;--hairline:#ddd5cd;--surface:#eee8e1}
    body{min-height:100vh;min-height:100svh;max-width:1160px;margin:0 auto;padding:3rem 3.5rem 1.25rem;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:17px/1.6 'Source Serif 4',Georgia,serif}
    a{color:inherit;text-underline-offset:4px;text-decoration-color:var(--rust)}
    a:focus-visible{outline:2px solid var(--rust);outline-offset:5px}
    header,main,footer{width:100%;margin:0;padding:0}
    .topbar{display:flex;align-items:center;justify-content:flex-start;gap:20px}
    .identity{text-decoration:none;display:flex;align-items:center;gap:13px}
    .identity img{width:44px;height:44px;object-fit:contain;border:1px solid var(--line);border-radius:50%;background:#eee6dc}
    .back{display:inline-flex;align-items:center;min-height:32px;padding:.1rem 0;background:transparent;border:0;border-radius:0;box-shadow:none;margin-bottom:1.3rem;color:var(--muted);font-size:.82rem;text-decoration:none}
    .back::before{display:none}
    .icon-arrow-left{width:.85em;height:.85em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    main{flex:1 0 auto;max-width:1000px;margin-inline:auto;padding-top:3.2rem;padding-bottom:4rem}
    .eyebrow{font:11px/1.6 system-ui,sans-serif;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
    .eyebrow.category{color:var(--rust);margin-top:12px}
    h1{font-weight:450;font-size:clamp(42px,6vw,68px);letter-spacing:-.05em;line-height:1.08;margin:10px 0 18px;overflow-wrap:anywhere}
    .summary{font-size:21px;line-height:1.55;color:var(--muted);max-width:720px;margin:0}
    .cover{margin:38px 0 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:24px;min-height:300px;display:grid;place-items:center}
    .cover img{display:block;width:100%;max-height:560px;object-fit:contain;border-radius:6px}
    .content{max-width:760px;margin-top:38px}
    .content p{margin:0 0 26px}
    h2{font-weight:500;font-size:24px;line-height:1.25;margin:34px 0 14px}
    ul{padding-left:22px;margin:0}
    li{margin:0 0 10px;padding-left:5px}
    li::marker{color:var(--rust)}
    .skills{font:12px/1.6 system-ui,sans-serif;color:var(--muted);margin-top:24px}
    .links{margin-top:18px}
    .gallery{display:grid;gap:28px;margin-top:40px}
    figure{margin:0}
    figure img{display:block;width:100%;max-height:680px;object-fit:contain;border:1px solid var(--line);background:var(--surface);border-radius:10px}
    figcaption{font-size:13px;color:var(--muted);margin-top:8px}
    .site-footer{flex:0 0 auto;margin-top:1.5rem;color:var(--muted);font-size:.9rem;line-height:1.7}
    .site-footer-bottom{display:flex;align-items:center;justify-content:space-between;gap:.5rem 1.5rem}
    .site-copyright{color:var(--muted);font-size:.76rem;white-space:nowrap}
    .social-links{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.1rem .9rem;list-style:none}
    .social-links a{display:inline-flex;align-items:center;gap:.45rem;min-height:36px;box-shadow:none;font-size:.8rem;color:var(--muted);text-decoration:none}
.social-links a::before{content:"";display:block;flex:0 0 .3rem;width:.3rem;height:.3rem;border-radius:50%;background:var(--rust);opacity:.6;transition:opacity 180ms ease}
.social-links a:hover,.social-links a:focus-visible{color:var(--ink)}
.social-links a:hover::before,.social-links a:focus-visible::before{opacity:1}
    .social-links li:first-child a::before{display:none}
    @media(prefers-color-scheme:dark){:root{--paper:#171411;--ink:#e7dfd3;--muted:#aaa095;--rust:#df7955;--line:#55483f;--hairline:#55483f;--surface:#27211c}}
    @media(max-width:820px){body{padding:2rem 1.5rem 1.25rem}}
    @media(max-width:640px){.site-footer-bottom{align-items:center;flex-direction:column;gap:.25rem;text-align:center}.social-links{justify-content:center}}
    @media(max-width:600px){.identity img{width:38px;height:38px}main{padding-top:2rem;padding-bottom:3rem}.summary{font-size:19px}.cover{padding:14px;min-height:210px;margin-top:28px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="identity" href="portfolio-preview.html" aria-label="Will Chavez portfolio">
      <img src="img/will.png" alt="">
      <span>Will Chavez</span>
    </a>
  </header>
  <main>
    <a class="back" href="portfolio-preview.html"><svg class="icon-arrow-left" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M12.5 8h-9m0 0 4-4m-4 4 4 4" /></svg>Back to projects</a>
    <article id="project" aria-live="polite"></article>
  </main>
  <footer class="site-footer"><div class="site-footer-bottom"><p class="site-copyright">© <span id="current-year"></span> Will Chavez</p><ul class="social-links"><li><a href="https://github.com/willchavez">GitHub</a></li><li><a href="https://www.linkedin.com/in/willchavez/">LinkedIn</a></li><li><a href="https://bsky.app/profile/willchavez.bsky.social">Bluesky</a></li><li><a href="https://www.instagram.com/willchavez/">Instagram</a></li></ul></div></footer>
  <script type="module">
    document.getElementById('current-year').textContent = new Date().getFullYear();
    import { projects } from './project-data.js';
    const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const project = projects.find(item => item.slug === new URLSearchParams(location.search).get('slug'));
    const root = document.querySelector('#project');
    if (!project) {
      document.title = 'Project not found — Will Chavez';
      root.innerHTML = '<p>That project could not be found. <a href="portfolio-preview.html">Back to projects</a>.</p>';
    } else {
      document.title = `${project.title} — Will Chavez`;
      document.querySelector('meta[name="description"]').content = project.summary;
      root.innerHTML = `
        <div class="eyebrow">${esc(project.org)}</div>
        <div class="eyebrow category">${esc(project.category)}</div>
        <h1>${esc(project.title)}</h1>
        <p class="summary">${esc(project.summary)}</p>
        <figure class="cover"><img src="${esc(project.cover)}" alt="${esc(project.images[0]?.alt || project.title)}"></figure>
        <section class="content" aria-label="Project details">
          <p>${esc(project.about)}</p>
          <h2>My contribution</h2>
          <ul>${project.contributions.map(item => `<li>${esc(item)}</li>`).join('')}</ul>
          <div class="skills">${esc(project.skills)}</div>
          ${project.links.length ? `<div class="links">${project.links.map(([url,label]) => `<p><a href="${esc(url)}" target="_blank" rel="noreferrer">${esc(label.replace(/<[^>]+>/g,'').replace(/[→↗]/g,''))} ↗</a></p>`).join('')}</div>` : ''}
        </section>
        <section class="gallery" aria-label="Project images">${project.images.map(image => `<figure><img src="${esc(image.src)}" alt="${esc(image.alt)}" loading="lazy"><figcaption>${esc(image.alt)}</figcaption></figure>`).join('')}</section>
      `;
    }
  </script>
</body>
</html>
