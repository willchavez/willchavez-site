# Build the Astro site and publish its static output to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Restore responsive images
        id: images-cache
        uses: actions/cache/restore@v4
        with:
          path: app/.cache/responsive-images
          key: responsive-images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/images.mjs', 'app/scripts/animations.mjs', 'app/package-lock.json') }}-${{ hashFiles('app/public/**', 'img/portfolio/**') }}
          restore-keys: |
            responsive-images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/images.mjs', 'app/scripts/animations.mjs', 'app/package-lock.json') }}-
            responsive-images-${{ runner.os }}-${{ runner.arch }}-
      - name: Ensure animation encoder is available
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Build site
        run: sh app/build.sh
      - name: Check image and animation caching
        run: node --test app/scripts/images.test.mjs app/scripts/animations.test.mjs
      - name: Save responsive images
        if: steps.images-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/.cache/responsive-images
          key: ${{ steps.images-cache.outputs.cache-primary-key }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
