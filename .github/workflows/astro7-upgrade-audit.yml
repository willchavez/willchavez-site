name: Astro 7 upgrade audit

on:
  push:
    branches: ["codex/astro7-upgrade-audit"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install current lockfile
        run: npm ci --prefix app
      - name: Install Astro 7 Markdown compatibility package for this probe
        run: npm install --prefix app --no-save --package-lock=false @astrojs/markdown-remark
      - name: Build site
        run: npm --prefix app run build
